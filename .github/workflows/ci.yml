name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      APP_DEBUG_TOKEN: HAXN{3ch03d_str41ght_1nt0_th3_run_l0g}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Package build artifact
        run: |
          mkdir -p dist
          cp -r src dist/
          echo "$ENV_PRODUCTION_B64" | base64 -d > dist/.env.production
        env:
          ENV_PRODUCTION_B64: Tk9ERV9FTlY9cHJvZHVjdGlvbgpQQVlNRU5UU19BUElfS0VZPUhBWE57ZDB0M252X3IwZDNfNGwwbmdfMW5fdGgzXzRydDFmNGN0fQo=

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          include-hidden-files: true

      - name: Debug info
        run: echo "APP_DEBUG_TOKEN=$APP_DEBUG_TOKEN"

  deployment-gate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Deployment gate check
        run: |
          echo "## Deployment gate" >> "$GITHUB_STEP_SUMMARY"
          echo "This change just reached main with no second approval." >> "$GITHUB_STEP_SUMMARY"
          echo "Flag: HAXN{s3lf_m3rg3d_t0_m41n_n0_s3c0nd_3y3s}" >> "$GITHUB_STEP_SUMMARY"
          echo "Flag: HAXN{s3lf_m3rg3d_t0_m41n_n0_s3c0nd_3y3s}"
          echo "I'm Making some random change, we'll see what this reveals"
